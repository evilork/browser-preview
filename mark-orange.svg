<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242424"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff9000" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ff9000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc066"/>
      <stop offset=".55" stop-color="#ff9a12"/>
      <stop offset="1" stop-color="#ff8a00"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a4c00"/>
      <stop offset="1" stop-color="#3a2000"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset=".35" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="glass"><rect x="60" y="48" width="136" height="160" rx="38"/></clipPath>
    <clipPath id="upper"><polygon points="0,-2 230,-2 18,254 0,254"/></clipPath>
    <clipPath id="lower"><polygon points="236,2 256,2 256,258 24,258"/></clipPath>
  </defs>
  <rect width="256" height="256" rx="60" fill="url(#tile)"/>
  <rect x=".75" y=".75" width="254.5" height="254.5" rx="59.25" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="1.5"/>
  <circle cx="128" cy="128" r="104" fill="url(#halo)"/>
  <g clip-path="url(#glass)">
    <g clip-path="url(#lower)">
      <rect width="256" height="256" fill="url(#shade)"/>
      <rect width="256" height="256" fill="#ff9000" fill-opacity=".14"/>
    </g>
    <g clip-path="url(#upper)">
      <rect width="256" height="256" fill="url(#lit)"/>
      <rect x="60" y="48" width="136" height="160" fill="url(#sheen)"/>
    </g>
  </g>
  <line x1="24" y1="258" x2="236" y2="2" stroke="#ffb347" stroke-opacity=".55" stroke-width="2" clip-path="url(#glass)" transform="translate(1.5 1.2)"/>
</svg>
